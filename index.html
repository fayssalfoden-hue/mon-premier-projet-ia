<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionnaire de Tâches</title>

  <!-- CDN officiel de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --fond: #0f1115;
      --carte: #181b22;
      --bordure: #262a34;
      --texte: #e6e8ee;
      --texte-doux: #9aa1b1;
      --accent: #6c8cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--fond);
      color: var(--texte);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    p.sous-titre {
      margin: 0 0 24px;
      color: var(--texte-doux);
      font-size: 14px;
    }

    .carte {
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 14px;
      padding: 20px;
    }

    .ligne-formulaire {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--bordure);
      background: #11141a;
      color: var(--texte);
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #0b0d12;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--bordure);
      border-radius: 10px;
      margin-bottom: 10px;
      background: #14171e;
    }

    .titre-tache { font-size: 15px; }

    .badge {
      font-size: 12px;
      color: var(--texte-doux);
      border: 1px solid var(--bordure);
      border-radius: 999px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    .message {
      color: var(--texte-doux);
      font-size: 14px;
      text-align: center;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Gestionnaire de Tâches</h1>
    <p class="sous-titre">HTML + CSS + JavaScript pur, connecté à Supabase.</p>

    <div class="carte">
      <!-- Formulaire d'ajout -->
      <div class="ligne-formulaire">
        <input type="text" id="champ-tache" placeholder="Nouvelle tâche..." />
        <button id="bouton-ajouter">Ajouter</button>
      </div>

      <!-- Liste des tâches -->
      <ul id="liste-taches"></ul>
      <div class="message" id="message">Chargement...</div>
    </div>
  </div>

  <script>
    // ---------- 1. Connexion à Supabase ----------
    const SUPABASE_URL = "https://vpquzuweianhldjnrtmp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZSj6Q0_XWSLCdoVKkIuZ1g_PYdDF-7A";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Raccourcis vers les éléments de la page
    const champTache = document.getElementById("champ-tache");
    const boutonAjouter = document.getElementById("bouton-ajouter");
    const listeTaches = document.getElementById("liste-taches");
    const message = document.getElementById("message");

    // ---------- 2. Afficher la liste des tâches ----------
    async function chargerTaches() {
      message.textContent = "Chargement...";

      const { data, error } = await supabase
        .from("tasks")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        message.textContent = "Erreur : " + error.message;
        return;
      }

      listeTaches.innerHTML = "";

      if (data.length === 0) {
        message.textContent = "Aucune tâche pour le moment.";
        return;
      }

      message.textContent = "";

      data.forEach(function (tache) {
        const li = document.createElement("li");

        const titre = document.createElement("span");
        titre.className = "titre-tache";
        titre.textContent = tache.title;

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = tache.status;

        li.appendChild(titre);
        li.appendChild(badge);
        listeTaches.appendChild(li);
      });
    }

    // ---------- 3. Ajouter une nouvelle tâche ----------
    async function ajouterTache() {
      const titre = champTache.value.trim();

      if (titre === "") {
        champTache.focus();
        return;
      }

      const { error } = await supabase
        .from("tasks")
        .insert({ title: titre, status: "À faire" });

      if (error) {
        message.textContent = "Erreur : " + error.message;
        return;
      }

      champTache.value = "";
      chargerTaches();
    }

    // Clic sur le bouton, ou touche Entrée dans le champ
    boutonAjouter.addEventListener("click", ajouterTache);
    champTache.addEventListener("keydown", function (e) {
      if (e.key === "Enter") ajouterTache();
    });

    // Au chargement de la page
    chargerTaches();
  </script>
</body>
</html>
